<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crypto Daily">
<meta name="theme-color" content="#141414">
<link rel="manifest" href="/manifest.json">
<title>Crypto Daily</title>
<style>
:root{--bg:#fff;--card:#f4f4f5;--ink:#141414;--mute:#5f6368;--accent:#bb1919;--line:#e2e2e4;--up:#0a7d3b;--down:#bb1919;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#101113;--card:#1b1c1f;--ink:#f1f1f2;--mute:#a0a4ab;--accent:#ff5a5a;--line:#2b2d31;--up:#4cd07d;--down:#ff6b6b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{background:#141414;color:#fff;padding:14px 16px}
.brand{display:flex;align-items:baseline;gap:8px}
.logo{background:var(--accent);color:#fff;font-weight:800;padding:2px 8px;letter-spacing:.5px}
.brand h1{font-size:20px;margin:0}
.date{font-size:13px;color:#b8bbc2;margin-top:4px}
.ticker{display:flex;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;overflow-x:auto;white-space:nowrap}
.ticker b{color:var(--accent)}.up{color:var(--up)}.down{color:var(--down)}
.chips{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:20px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:0 16px 24px;max-width:720px;margin:0 auto}
article{border-top:1px solid var(--line);padding:16px 0}
article:first-child{border-top:0}
.tag{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
article h2{font-size:20px;line-height:1.25;margin:4px 0 6px}
article.lead h2{font-size:24px}
article p{margin:0 0 8px}
.meta{font-size:13px;color:var(--mute)}
.meta a{color:var(--accent);text-decoration:none;font-weight:600}
.msg{padding:24px 0;color:var(--mute)}
footer{padding:16px;font-size:12px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<header>
<div class="brand"><span class="logo">CRYPTO</span><h1>Daily</h1></div>
<div class="date" id="date">Loading today’s news…</div>
</header>
<div class="ticker" id="ticker"></div>
<div class="chips" id="chips"></div>
<main id="list"><div class="msg">Loading…</div></main>
<footer>Headlines from CoinDesk, Cointelegraph, Decrypt and Yahoo Finance. Tap Read to open the original. Not financial advice.</footer>
<script>
var cats=["All","Markets","Security","Companies","Policy","Tech"],cur="All",items=[];
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function money(n){return "$"+Math.round(n).toLocaleString("en-US")}
function chg(n){var s=el("span",n>=0?"up":"down",(n>=0?"+":"")+n.toFixed(1)+"%");return s}
function ago(t){var h=Math.round((Date.now()-t)/36e5);return h<1?"just now":h<24?h+"h ago":Math.round(h/24)+"d ago"}
function render(){
 var cw=document.getElementById("chips");cw.textContent="";
 cats.forEach(function(c){var b=el("button","chip",c);b.setAttribute("aria-pressed",c===cur);b.onclick=function(){cur=c;render()};cw.appendChild(b)});
 var l=document.getElementById("list");l.textContent="";
 var shown=items.filter(function(s){return cur==="All"||s.category===cur});
 if(!shown.length){l.appendChild(el("div","msg","No stories in this category today. Try All."));return}
 shown.forEach(function(s,i){
  var a=el("article",i===0?"lead":"");
  a.append(el("div","tag",s.category),el("h2","",s.title));
  if(s.summary)a.append(el("p","",s.summary));
  var
</script>
</body>
</html>
